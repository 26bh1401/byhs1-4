<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>부여고 급식</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50">

    <header class="w-full bg-slate-900 text-white py-8 px-6 shadow-2xl">
        <div class="max-w-4xl mx-auto">
            <div>
                <p class="text-emerald-400 text-xs font-bold mb-1 tracking-widest uppercase">Buyeo High School 1-4</p>
                <h1 class="text-3xl font-black tracking-tighter">🍱 오늘의 급식</h1>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto p-4 mt-2">
        <div id="content-meal">
            <section class="card border-t-4 border-emerald-400">
                <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
                    <h2 class="title text-gray-700 text-xl"><i class="fas fa-utensils text-emerald-500"></i> 오늘의 식단표</h2>
                    <div class="flex bg-gray-100 p-1.5 rounded-2xl text-[13px] font-black">
                        <button id="btn-meal-1" class="px-5 py-2.5 rounded-xl transition-all mr-1">조식</button>
                        <button id="btn-meal-2" class="px-5 py-2.5 rounded-xl transition-all mr-1">중식</button>
                        <button id="btn-meal-3" class="px-5 py-2.5 rounded-xl transition-all">석식</button>
                    </div>
                </div>
                <div id="meal-display-container" class="min-h-[250px] flex items-center justify-center transition-all duration-300"></div>
            </section>
        </div>
    </main>

    <script type="module" src="script.js"></script>
</body>
</html>
