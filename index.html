<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>부여고 급식</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-50">

    <header class="w-full bg-slate-900 text-white py-8 px-6 shadow-2xl">
        <div class="max-w-4xl mx-auto">
            <div>
                <p class="text-emerald-400 text-xs font-bold mb-1 tracking-widest uppercase">부여고등학교</p>
                <h1 class="text-3xl font-black tracking-tighter">🍱 오늘의 급식</h1>
            </div>
        </div>
    </header>

    <!-- 탭 네비게이션 -->
    <div class="w-full bg-white border-b border-gray-200 sticky top-0 z-40">
        <div class="max-w-4xl mx-auto px-4">
            <div class="flex gap-0">
                <button id="tab-today" class="tab-btn px-6 py-4 font-black text-center border-b-4 border-emerald-500 text-emerald-600 transition-all">
                    <i class="fas fa-calendar-day mr-2"></i>오늘의 급식
                </button>
                <button id="tab-calendar" class="tab-btn px-6 py-4 font-black text-center border-b-4 border-transparent text-gray-400 hover:text-gray-600 transition-all">
                    <i class="fas fa-calendar mr-2"></i>달력
                </button>
            </div>
        </div>
    </div>

    <main class="max-w-4xl mx-auto p-4 mt-2">
        <!-- 오늘의 급식 탭 -->
        <div id="content-meal" class="tab-content">
            <section class="card border-t-4 border-emerald-400">
                <div class="flex flex-col md:flex-row justify-between items-center mb-8 gap-4">
                    <h2 class="title text-gray-700 text-xl"><i class="fas fa-utensils text-emerald-500"></i> 오늘의 식단표</h2>
                    <div class="flex bg-gray-100 p-1.5 rounded-2xl text-[13px] font-black">
                        <button id="btn-meal-1" class="px-5 py-2.5 rounded-xl transition-all mr-1">조식</button>
                        <button id="btn-meal-2" class="px-5 py-2.5 rounded-xl transition-all mr-1">중식</button>
                        <button id="btn-meal-3" class="px-5 py-2.5 rounded-xl transition-all">석식</button>
                    </div>
                </div>
                <div id="meal-display-container" class="min-h-[250px] flex items-center justify-center transition-all duration-300"></div>
            </section>
        </div>

        <!-- 달력 탭 -->
        <div id="content-calendar" class="tab-content hidden">
            <section class="card border-t-4 border-blue-400">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="title text-gray-700 text-xl"><i class="fas fa-calendar-alt text-blue-500"></i> 월별 급식</h2>
                    <div class="flex gap-2">
                        <button id="btn-prev-month" class="px-4 py-2 bg-blue-100 text-blue-600 rounded-lg font-bold hover:bg-blue-200 transition">
                            <i class="fas fa-chevron-left"></i>
                        </button>
                        <div id="current-month-display" class="px-4 py-2 text-gray-700 font-black min-w-40 text-center"></div>
                        <button id="btn-next-month" class="px-4 py-2 bg-blue-100 text-blue-600 rounded-lg font-bold hover:bg-blue-200 transition">
                            <i class="fas fa-chevron-right"></i>
                        </button>
                    </div>
                </div>
                <div id="calendar-display" class="w-full"></div>
            </section>
        </div>
    </main>

    <!-- 날짜별 급식 상세 모달 -->
    <div id="meal-modal" class="fixed inset-0 bg-black/50 hidden flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-3xl p-8 max-w-md w-full shadow-2xl">
            <div class="flex justify-between items-start mb-4">
                <h3 id="modal-title" class="text-2xl font-black text-gray-800"></h3>
                <button onclick="closeMealModal()" class="text-gray-400 hover:text-gray-600 text-2xl">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div id="modal-content" class="space-y-4"></div>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
